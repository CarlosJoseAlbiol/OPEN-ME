<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0E27">
<title>OPEN ME!</title>

<!--
  HOW TO USE THIS FILE
  =====================
  1. Optional background music: add a file named bgmusic.mp3 (or .m4a/.ogg)
     in the SAME FOLDER as this index.html file. It plays softly once you
     tap in, and just keeps playing continuously — opening or closing the
     envelope doesn't affect it. No file = it's just silently skipped,
     nothing breaks.
     A NOTE ON THIS: don't put a copyrighted song's actual audio file in a
     public GitHub repo — that's redistributing it, which isn't allowed
     even for something this personal. Either use a track you have rights
     to and keep the repo/Pages link private, or use something royalty-free
     (YouTube Audio Library, Pixabay Music, etc.) if you want it public.
  2. Edit HER_NAME near the bottom of this file if the spelling isn't right.
  3. Edit the surprise message text further down (search for bouquet-message) if
     you want to change a word here or there.
  4. Push this whole folder to a GitHub repo, turn on GitHub Pages
     (Settings -> Pages -> Deploy from branch -> main -> / root), and the
     link it gives you is the card, ready to send. Works on phones too —
     tested for iOS Safari and Android Chrome's autoplay rules specifically
     (see the JS comments near "start overlay" for why the extra tap exists).
-->

<style>
  :root{
    --midnight:#0A0E27;
    --deep:#161F5C;
    --indigo:#3A4FCB;
    --periwinkle:#8FA0FF;
    --ice:#E7ECFF;
    --gold:#F2C879;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html{ height:100%; }
  body{
    min-height:100%;
    margin:0;
    background:
      radial-gradient(ellipse at 50% 0%, var(--deep) 0%, var(--midnight) 60%);
    background-attachment:fixed;
    overflow-x:hidden;
    font-family:'Inter', sans-serif;
  }

  /* ---------- FIXED BACKGROUND FX LAYERS ---------- */
  .bg-fx{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }

  .stars{ position:absolute; inset:0; z-index:1; }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:var(--periwinkle);
    border-radius:50%;
    opacity:0.35;
    animation: drift 14s linear infinite;
  }
  @keyframes drift{
    from{ transform:translateY(0); opacity:0; }
    10%{ opacity:.5; }
    90%{ opacity:.5; }
    to{ transform:translateY(-120px); opacity:0; }
  }

  .shooting-stars{ position:absolute; inset:0; z-index:2; }
  .shooting-star{
    position:absolute;
    width:140px; height:2px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    border-radius:2px;
    opacity:0;
    animation: shoot 1.15s ease-in forwards;
  }
  @keyframes shoot{
    0%{ opacity:0; transform: translate(0,0) rotate(24deg) scaleX(.3); }
    12%{ opacity:1; }
    75%{ opacity:.9; }
    100%{ opacity:0; transform: translate(240px,120px) rotate(24deg) scaleX(1); }
  }

  /* falling petals — spawned only while the letter is open, sit above
     everything (including the card) like gentle snowfall */
  .petals-layer{ position:fixed; inset:0; z-index:50; pointer-events:none; overflow:hidden; }
  .petal-fall{
    position:absolute;
    top:-24px;
    border-radius:0% 90% 0% 90%;
    opacity:.85;
    will-change: transform, opacity;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes petalFall{
    0%   { transform: translate3d(0,-5vh,0) rotate(0deg); opacity:.9; }
    100% { transform: translate3d(var(--drift,0px), 112vh, 0) rotate(var(--spin,420deg)); opacity:.3; }
  }

  /* ---------- START OVERLAY ----------
     iOS Safari and Android Chrome both refuse to play audio with sound
     until a real tap/click has happened on the page — that's a platform
     rule, not something any code can route around. This overlay's tap IS
     that gesture: it starts the background music and then gets out of the
     way, before the envelope itself is ever touched. */
  .start-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at 50% 0%, var(--deep) 0%, var(--midnight) 60%);
    cursor:pointer;
    touch-action: manipulation;
    transition: opacity .6s ease;
  }
  .start-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .start-text{
    font-family:'Cormorant Garamond','Georgia',serif;
    font-style:italic;
    color:var(--ice);
    font-size:clamp(20px, 5vw, 28px);
    letter-spacing:.04em;
    text-align:center;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.65; }
    50%{ opacity:1; }
  }

  /* ---------- STAGE ---------- */
  .scene{
    position:relative;
    z-index:10;
    min-height:100vh;
    min-height:100dvh;
    width:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 16px 90px;
  }

  .stage{
    position:relative;
    width:min(92vw, 420px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  .hint{
    color:var(--periwinkle);
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.75;
  }

  /* ---------- ENVELOPE ---------- */
  .envelope-wrap{
    position:relative;
    width:min(88vw, 340px);
    aspect-ratio: 340 / 220;
    cursor:pointer;
    touch-action: manipulation;
    perspective: 1200px;
  }

  .envelope-body{
    position:absolute;
    inset:0;
    background: linear-gradient(160deg, var(--indigo), #29357f 75%);
    border-radius:10px;
    box-shadow: 0 25px 60px -20px rgba(20,25,90,0.7);
    overflow:hidden;
  }
  .envelope-body::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(135deg, transparent 49.3%, rgba(0,0,0,.18) 50%, transparent 50.7%),
      linear-gradient(45deg, transparent 49.3%, rgba(0,0,0,.18) 50%, transparent 50.7%);
  }

  .seal{
    position:absolute;
    top:50%; left:50%;
    width:54px; height:54px;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, #ffe2a8, var(--gold) 60%, #c98f3a 100%);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px rgba(0,0,0,.35);
    z-index:5;
    transition: transform .4s ease, opacity .4s ease;
  }
  .seal svg{ width:26px; height:26px; }

  .flap{
    position:absolute;
    top:0; left:0; width:100%; height:58%;
    background: linear-gradient(200deg, #4358df, var(--indigo) 80%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1s cubic-bezier(.6,0,.3,1);
    z-index:4;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }

  .stage.opened .flap{ transform: rotateX(178deg); }
  .stage.opened .seal{ opacity:0; transform:translate(-50%,-50%) scale(0.4); }

  /* ---------- CARD (revealed panel) ---------- */
  .card{
    position:relative;
    margin-top:14px;
    width:100%;
    max-width:340px;
    background: linear-gradient(180deg, #F4F6FF, #E1E7FF);
    border-radius:14px;
    padding:30px 26px 100px;
    text-align:center;
    box-shadow: 0 30px 70px -25px rgba(10,14,50,.6);
    opacity:0;
    transform: translateY(24px) scale(.96);
    transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
  }
  .stage.opened .card{
    opacity:1;
    transform: translateY(0) scale(1);
    pointer-events:auto;
    transition-delay: .9s;
  }

  .eyebrow{
    margin:0 0 4px;
    color:var(--indigo);
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-weight:600;
  }
  .title{
    margin:0 0 6px;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-style:italic;
    font-weight:600;
    font-size:34px;
    color:#1B2461;
    line-height:1.05;
  }
  .subtitle{
    margin:0 0 10px;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size:17px;
    color:#4A55A0;
  }

  /* ---------- LILY BOUQUET ---------- */
  .lily-holder{
    width:210px;
    height:240px;
    margin:6px auto 4px;
  }
  .lily-holder svg{ width:100%; height:100%; overflow:visible; }

  /* stems + bow grow upward from the base before any flower blooms */
  .stems{
    transform-origin: 50% 100%;
    transform: scaleY(0);
    opacity:0;
    transition: transform .9s cubic-bezier(.3,1,.4,1), opacity .5s ease;
  }
  .stage.opened .stems{
    transform: scaleY(1);
    opacity:1;
    transition-delay: .9s;
  }

  .petal-inner{
    transform: scale(0.26);
    opacity:.5;
    transition: transform 1.3s cubic-bezier(.34,1.15,.4,1), opacity 1s ease;
  }
  .stage.opened .petal-inner{ opacity:1; transform: scale(1); }

  /* each of the 3 flowers blooms in its own staggered run, main flower
     first, then left, then right, so the bouquet opens in a sequence
     rather than all six-times-three petals popping at once */
  .stage.opened .flower-main .petal-group:nth-child(1) .petal-inner{ transition-delay: 1.15s; }
  .stage.opened .flower-main .petal-group:nth-child(2) .petal-inner{ transition-delay: 1.27s; }
  .stage.opened .flower-main .petal-group:nth-child(3) .petal-inner{ transition-delay: 1.39s; }
  .stage.opened .flower-main .petal-group:nth-child(4) .petal-inner{ transition-delay: 1.51s; }
  .stage.opened .flower-main .petal-group:nth-child(5) .petal-inner{ transition-delay: 1.63s; }
  .stage.opened .flower-main .petal-group:nth-child(6) .petal-inner{ transition-delay: 1.75s; }

  .stage.opened .flower-left .petal-group:nth-child(1) .petal-inner{ transition-delay: 1.45s; }
  .stage.opened .flower-left .petal-group:nth-child(2) .petal-inner{ transition-delay: 1.57s; }
  .stage.opened .flower-left .petal-group:nth-child(3) .petal-inner{ transition-delay: 1.69s; }
  .stage.opened .flower-left .petal-group:nth-child(4) .petal-inner{ transition-delay: 1.81s; }
  .stage.opened .flower-left .petal-group:nth-child(5) .petal-inner{ transition-delay: 1.93s; }
  .stage.opened .flower-left .petal-group:nth-child(6) .petal-inner{ transition-delay: 2.05s; }

  .stage.opened .flower-right .petal-group:nth-child(1) .petal-inner{ transition-delay: 1.75s; }
  .stage.opened .flower-right .petal-group:nth-child(2) .petal-inner{ transition-delay: 1.87s; }
  .stage.opened .flower-right .petal-group:nth-child(3) .petal-inner{ transition-delay: 1.99s; }
  .stage.opened .flower-right .petal-group:nth-child(4) .petal-inner{ transition-delay: 2.11s; }
  .stage.opened .flower-right .petal-group:nth-child(5) .petal-inner{ transition-delay: 2.23s; }
  .stage.opened .flower-right .petal-group:nth-child(6) .petal-inner{ transition-delay: 2.35s; }

  .stamen{
    opacity:0;
    transform: scale(.3);
    transition: opacity .8s ease, transform .8s cubic-bezier(.3,1.3,.4,1);
  }
  .stage.opened .stamen{ opacity:1; transform: scale(1); }
  .stage.opened .flower-main .stamen{ transition-delay: 1.95s; }
  .stage.opened .flower-left .stamen{ transition-delay: 2.25s; }
  .stage.opened .flower-right .stamen{ transition-delay: 2.55s; }

  /* ---------- SURPRISE MESSAGE ---------- */
  .bouquet-message{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid rgba(27,36,97,.15);
    text-align:center;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .stage.opened .bouquet-message{
    opacity:1;
    transform:translateY(0);
    transition-delay: 3.7s;
  }
  .bouquet-message p{
    font-family:'Cormorant Garamond','Georgia',serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    line-height:1.5;
    color:#1B2461;
    margin:0;
  }

  /* ---------- ALIEN MASCOT ---------- */
  .alien{
    position:absolute;
    width:54px; height:54px;
    right:-14px;
    bottom:-14px;
    z-index:6;
    transform: rotate(0deg) scale(0);
    transition: transform .7s cubic-bezier(.3,1.6,.4,1);
    filter: drop-shadow(0 6px 10px rgba(10,14,50,.35));
  }
  .stage.opened .alien{
    transform: rotate(-8deg) scale(1);
    transition-delay: 4.0s;
  }
  .alien svg{ width:100%; height:100%; }
  .alien .arm{
    transform-origin: 70% 60%;
    animation: wave 1.6s ease-in-out infinite;
    animation-play-state: paused;
  }
  .stage.opened .alien .arm{ animation-play-state: running; animation-delay: 4.3s; }
  @keyframes wave{
    0%,100%{ transform: rotate(0deg); }
    50%{ transform: rotate(-22deg); }
  }

  .speech-bubble{
    position:absolute;
    right:-38px;
    bottom:58px;
    z-index:6;
    background:#fff;
    color:#1B2461;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    line-height:1.3;
    padding:8px 11px;
    border-radius:12px 12px 2px 12px;
    white-space:nowrap;
    box-shadow: 0 8px 18px -6px rgba(10,14,50,.4);
    opacity:0;
    transform: translateY(6px) scale(.9);
    transform-origin: bottom right;
    transition: opacity .5s ease, transform .5s cubic-bezier(.3,1.4,.4,1);
  }
  .stage.opened .speech-bubble{
    opacity:1;
    transform: translateY(0) scale(1);
    transition-delay: 4.3s;
  }

  @media (prefers-reduced-motion: reduce){
    .flap, .card, .petal-inner, .stamen, .stems, .bouquet-message, .start-overlay{
      transition-duration: .01ms !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>
<body>

<div class="bg-fx">
  <div class="stars" id="stars"></div>
  <div class="shooting-stars" id="shootingStars"></div>
</div>

<div class="petals-layer" id="petalsLayer"></div>

<div class="start-overlay" id="startOverlay">
  <p class="start-text">tap to begin ✧</p>
</div>

<div class="scene">
  <div class="stage" id="stage">

    <div class="envelope-wrap" id="envelope">
      <div class="envelope-body">
        <div class="flap"></div>
        <div class="seal">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 6l1.2 2.5 2.7.4-2 1.9.5 2.7L12 12.2l-2.4 1.3.5-2.7-2-1.9 2.7-.4L12 6z" fill="#1B2461"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="card" id="card">
      <p class="eyebrow">08 · 20</p>
      <h1 class="title">happy birthday</h1>
      <p class="subtitle" id="nameLine">Myles C. Grefiel</p>

      <div class="lily-holder">
        <svg viewBox="0 0 260 300">
          <defs>
            <linearGradient id="wrapGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FDF2F5"/>
              <stop offset="100%" stop-color="#F2C6D3"/>
            </linearGradient>
          </defs>

          <!--
            A wrapped paper bouquet, not bare stems: pointed paper folds
            tucked behind the flowers, a paper cone around the stems, and a
            ribbon tied at the neck — the whole group still grows up from
            the base together (see .stems in the CSS).
          -->
          <g class="stems">
            <!-- back paper folds, peeking up behind/between the flower heads -->
            <path d="M50,175 Q42,115 64,66 Q82,106 76,166 Z" fill="#F6D3DF"/>
            <path d="M210,175 Q218,115 196,66 Q178,106 184,166 Z" fill="#F6D3DF"/>
            <path d="M108,160 Q98,114 116,72 Q132,108 124,154 Z" fill="#FAE3EB"/>
            <path d="M152,160 Q162,114 144,72 Q128,108 136,154 Z" fill="#FAE3EB"/>

            <!-- short stem stubs — mostly swallowed by the wrap below -->
            <path d="M130,250 C150,222 170,202 185,175" stroke="#3F6B45" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M130,250 C130,215 130,170 130,120" stroke="#3F6B45" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M130,250 C110,222 90,202 75,175" stroke="#3F6B45" stroke-width="3" fill="none" stroke-linecap="round"/>

            <!-- tucked greenery -->
            <path d="M116,194 C103,189 96,179 98,169 C110,172 118,182 116,194 Z" fill="#4F7A4A"/>
            <path d="M144,194 C157,189 164,179 162,169 C150,172 142,182 144,194 Z" fill="#4F7A4A"/>

            <!-- the paper cone: scalloped top edge where flowers emerge,
                 tapering down to a narrow neck at the ribbon -->
            <path d="M52,178
                     C50,196 62,206 84,210
                     C102,213 112,203 130,207
                     C148,203 158,213 176,210
                     C198,206 210,196 208,178
                     C204,212 178,246 152,263
                     L130,273 L108,263
                     C82,246 56,212 52,178 Z"
                  fill="url(#wrapGrad)" stroke="#E9AFC2" stroke-width="1"/>

            <!-- crease lines for a folded-paper look -->
            <path d="M68,196 C74,222 92,244 116,256" stroke="#E9AFC2" stroke-width="1" fill="none" opacity=".6"/>
            <path d="M192,196 C186,222 168,244 144,256" stroke="#E9AFC2" stroke-width="1" fill="none" opacity=".6"/>

            <!-- front paper accents, layered slightly in front of the cone's top edge -->
            <path d="M87,184 Q82,152 94,124 Q106,152 102,180 Z" fill="#FDF2F5" opacity=".95"/>
            <path d="M173,184 Q178,152 166,124 Q154,152 158,180 Z" fill="#FDF2F5" opacity=".95"/>

            <!-- trailing ribbon tails, hanging past the wrap's bottom point -->
            <path d="M118,258 C112,272 104,284 92,294 L104,291 C114,280 118,268 124,257 Z" fill="#F4F6FF" stroke="#E4C68A" stroke-width=".6"/>
            <path d="M142,258 C148,272 156,284 168,294 L156,291 C146,280 142,268 136,257 Z" fill="#F4F6FF" stroke="#E4C68A" stroke-width=".6"/>

            <!-- ribbon band around the neck -->
            <path d="M92,240 Q130,260 168,240 L168,251 Q130,271 92,251 Z" fill="#FBFBFF" stroke="#E4C68A" stroke-width="1"/>

            <!-- bow knot -->
            <g transform="translate(130,246)">
              <path d="M0,0 C-16,-9 -23,4 -9,9 C-18,16 -11,25 0,16 Z" fill="#F2C879"/>
              <path d="M0,0 C16,-9 23,4 9,9 C18,16 11,25 0,16 Z" fill="#F2C879"/>
              <circle cx="0" cy="2" r="4.5" fill="#C98F3A"/>
            </g>
          </g>

          <!-- LEFT flower -->
          <g class="flower flower-left" transform="translate(75,150) rotate(-18) scale(0.46) translate(-100,-100)">
            <g class="petal-group" transform="translate(100 100) rotate(0)">
              <g class="petal-inner">
                <path d="M0,0 C-12,-35 -10,-75 0,-92 C10,-75 12,-35 0,0 Z" fill="#AEC0FF"/>
                <path d="M0,0 C-5,-28 -5,-60 0,-80" stroke="#7C8FE0" stroke-width="1" fill="none" opacity=".6"/>
              </g>
            </g>
            <g class="petal-group" transform="translate(100 100) rotate(60)">
              <g class="petal-inner">
                <path d="M0,0 C-12,-35 -10,-75 0,-92 C10,-75 12,-35 0,0 Z" fill="#9BB0FF"/>
                <path d="M0,0 C-5,-28 -5,-60 0,-80" stroke="#7086E6" stroke-width="1" fill="none" opacity=".6"/>
              </g>
            </g>
            <g class="petal-group" transform="translate(100 100) rotate(120)">
              <g class="petal-inner">
                <path d="M0,0 C-12,-35 -10,-75 0,-92 C10,-75 12,-35 0,0 Z" fill="#AEC0FF"/>
                <path d="M0,0 C-5,-28 -5,-60 0,-80" stroke="#7C8FE0" stroke-width="1" fill="none" opacity=".6"/>
              </g>
            </g>
            <g class="petal-group" transform="translate(100 100) rotate(180)">
              <g class="petal-inner">
                <path d="M0,0 C-12,-35 -10,-75 0,-92 C10,-75 12,-35 0,0 Z" fill="#9BB0FF"/>
                <path d="M0,0 C-5,-28 -5,-60 0,-80" stroke="#7086E6" stroke-width="1" fill="none" opacity=".6"/>
              </g>
            </g>
            <g class="petal-group" transform="translate(100 100) rotate(240)">
              <g class="petal-inner">
                <path d="M0,0 C-12,-35 -10,-75 0,-92 C10,-75 12,-35 0,0 Z" fill="#AEC0FF"/>
                <path d="M0,0 C-5,-28 -5,-60 0,-80" stroke="#7C8FE0" stroke-width="1" fill="none" opacity=".6"/>
              </g>
            </g>
            <g class="petal-group" transform="translate(100 100) rotate(300)">
              <g class="petal-inner">
                <path d="M0,0 C-12,-35 -10,-75 0,-92 C10,-75 12,-35 0,0 Z" fill="#9BB0FF"/>
                <path d="M0,0 C-5,-28 -5,-60 0,-80" stroke="#7086E6" stroke-width="1" fill="none" opacity=".6"/>
              </g>
            </g>
            <g transform="translate(100 100)">
              <g class="stamen">
                <line x1="0" y1="0" x2="-12" y2="-28" stroke="#5B3E1A" stroke-width="1.4"/>
                <line x1="0" y1="0" x2="0" y2="-34" stroke="#5B3E1A" stroke-width="1.4"/>
                <line x1="0" y1="0" x2="12" y2="-28" stroke="#5B3E1A" stroke-width="1.4"/>
                <line x1="0" y1="0" x2="-6" y2="-30" stroke="#5B3E1A" stroke-width="1.4"/>
                <line x1="0" y1="0" x2="6" y2="-30" stroke="#5B3E1A" stroke-width="1.4"/>
                <ellipse cx="-12" cy="-28" rx="3.4" ry="2" fill="#F2C879"/>
                <ellipse cx="0" cy="-34" rx="3.4" ry="2" fill="#F2C879"/>
                <ellipse cx="12" cy="-28" rx="3.4" ry="2" fill="#F2C879"/>
                <ellipse cx="-6" cy="-30" rx="3" ry="1.8" fill="#F2C879"/>
                <ellipse cx="6" cy="-30" rx="3" ry="1.8" fill="#F2C879"/>
                <circle cx="0" cy="0" r="3" fill="#7C5A22"/>
              </g>

<script>
  // ---- EDIT HERE ----
  const HER_NAME = "Myles C. Grefiel"; // change spelling if needed, or set to "" to hide the line
  document.getElementById('nameLine').textContent = HER_NAME || '';

  // ---------- ambient dust ----------
  const starsHolder = document.getElementById('stars');
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDuration = (10 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    starsHolder.appendChild(s);
  }

  // ---------- shooting stars (always running, closed or open) ----------
  const shootingHolder = document.getElementById('shootingStars');
  function spawnShootingStar(){
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.top = (5 + Math.random() * 45) + '%';
    star.style.left = (-10 + Math.random() * 50) + '%';
    shootingHolder.appendChild(star);
    star.addEventListener('animationend', () => star.remove());
    scheduleNextShootingStar();
  }
  function scheduleNextShootingStar(){
    setTimeout(spawnShootingStar, 3500 + Math.random() * 5500);
  }
  scheduleNextShootingStar();

  // ---------- falling petals (only while the letter is open) ----------
  const petalsLayer = document.getElementById('petalsLayer');
  let petalInterval = null;
  function spawnPetal(){
    const petal = document.createElement('div');
    petal.className = 'petal-fall';
    const size = 8 + Math.random() * 8; // width in px — NOT done via transform:scale,
                                          // since a CSS transform on this element would
                                          // fully override the animation's own transform
                                          // (same lesson learned from the lily petals).
    petal.style.width = size + 'px';
    petal.style.height = (size * 1.55) + 'px';
    petal.style.left = (Math.random() * 100) + '%';
    petal.style.background = Math.random() < 0.5
      ? 'linear-gradient(160deg, #AEC0FF, #7C8FE0)'
      : 'linear-gradient(160deg, #9BB0FF, #7086E6)';
    petal.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
    petal.style.setProperty('--spin', (360 + Math.random() * 360) + 'deg');
    petal.style.animationDuration = (7 + Math.random() * 6) + 's';
    petal.style.animationName = 'petalFall';
    petalsLayer.appendChild(petal);
    petal.addEventListener('animationend', () => petal.remove());
  }
  function startPetals(){
    if (petalInterval) return;
    spawnPetal();
    petalInterval = setInterval(spawnPetal, 420);
  }
  function stopPetals(){
    clearInterval(petalInterval);
    petalInterval = null;
    // existing petals are left to finish falling naturally, not yanked away
  }

  // ---------- audio fade helper ----------
  const bgMusic = document.getElementById('bgMusic');
  const BG_VOLUME = 0.35;

  // Ramps an <audio> element's volume smoothly. Deliberately NOT built on
  // requestAnimationFrame: rAF stops entirely whenever the tab isn't
  // actively painting (backgrounded, screen locked, switched away from —
  // exactly the kind of thing that happens on a phone), which can leave a
  // fade stuck partway. setInterval keeps ticking regardless, so the fade
  // always actually finishes. Also cancels any fade already running on the
  // same element first, so a quick double-tap on the envelope can't leave
  // two fades fighting over the volume value at once.
  function fadeVolume(audioEl, toVolume, duration, onComplete){
    if (audioEl._fadeTimer) clearInterval(audioEl._fadeTimer);
    const steps = 24;
    const stepMs = duration / steps;
    const fromVolume = audioEl.volume;
    const delta = (toVolume - fromVolume) / steps;
    let count = 0;
    audioEl._fadeTimer = setInterval(() => {
      count++;
      if (count >= steps) {
        clearInterval(audioEl._fadeTimer);
        audioEl._fadeTimer = null;
        audioEl.volume = toVolume;
        if (onComplete) onComplete();
      } else {
        audioEl.volume = Math.min(1, Math.max(0, fromVolume + delta * count));
      }
    }, stepMs);
  }

  // ---------- start overlay: the one required tap that unlocks audio ----------
  // iOS Safari and Android Chrome both refuse to play audio with sound
  // until a real tap/click has happened on the page. This overlay's tap
  // IS that gesture, and it's kept separate from opening the envelope so
  // the music genuinely plays first, while the card is still closed.
  const startOverlay = document.getElementById('startOverlay');
  startOverlay.addEventListener('click', () => {
    startOverlay.classList.add('hidden');
    bgMusic.volume = 0;
    bgMusic.play().then(() => fadeVolume(bgMusic, BG_VOLUME, 900)).catch(() => {});
  }, { once: true });

  // ---------- envelope: tap to open, tap again to close ----------
  const stage = document.getElementById('stage');
  const envelope = document.getElementById('envelope');
  const hint = document.getElementById('hint');

  envelope.addEventListener('click', () => {
    const isOpening = !stage.classList.contains('opened');
    stage.classList.toggle('opened');

    if (isOpening) {
      hint.textContent = 'tap the envelope to close';
      startPetals();
    } else {
      hint.textContent = 'tap the envelope to open';
      stopPetals();
    }
    // music is intentionally left alone here — it plays continuously
    // once started, regardless of whether the envelope is open or closed
  });
</script>
